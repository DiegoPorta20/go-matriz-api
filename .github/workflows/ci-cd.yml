name: CI/CD

# Un solo workflow para verificar y desplegar.
#
# Lo que separa las dos cosas es la condicion de los jobs de despliegue: se
# ejecutan solo con una etiqueta de version o a mano, nunca en un pull request.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Un push nuevo cancela la verificacion anterior, pero un despliegue en curso no
  # se interrumpe: dejar una Lambda a medio actualizar es peor que esperar.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  id-token: write # para pedir el token OIDC con el que se asume el rol

env:
  GO_VERSION: '1.25'
  COVERAGE_THRESHOLD: 80
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || secrets.LAMBDA_FUNCTION_NAME }}
  GO_API_URL: ${{ vars.GO_API_URL || vars.API_BASE_URL || vars.PUBLIC_API_URL || secrets.GO_API_URL || secrets.API_BASE_URL || secrets.PUBLIC_API_URL || '' }}
  NODE_SERVICE_URL: ${{ vars.NODE_SERVICE_URL || secrets.NODE_SERVICE_URL || '' }}
  CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || secrets.CORS_ALLOWED_ORIGINS || '' }}

  # Configuracion de la funcion. update-function-configuration REEMPLAZA el mapa de variables
  # completo, asi que todo lo que la funcion necesite tiene que estar aqui: lo que falte en este
  # bloque desaparece de la Lambda en el siguiente despliegue.
  #
  # AWS_REGION no se declara: es reservada y Lambda la inyecta con la region de la funcion.
  NODE_SERVICE_AUTH: ${{ vars.NODE_SERVICE_AUTH || 'iam' }}
  # Con imagen de contenedor el arranque en frio de node-api puede pasar de 5 s, y go-api
  # traduciria ese corte a un 502 sin que nada este mal.
  NODE_SERVICE_TIMEOUT_MS: ${{ vars.NODE_SERVICE_TIMEOUT_MS || '10000' }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  JWT_EXPIRATION_MINUTES: ${{ vars.JWT_EXPIRATION_MINUTES || '60' }}
  AUTH_USERNAME: ${{ vars.AUTH_USERNAME || secrets.AUTH_USERNAME }}
  AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
  MAX_MATRIX_DIMENSION: ${{ vars.MAX_MATRIX_DIMENSION || '50' }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}

  # El smoke test hace login de verdad, asi que por defecto usa las credenciales que este mismo
  # despliegue acaba de configurar. SMOKE_* sigue existiendo para poder apuntar a otras.
  SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME || secrets.SMOKE_USERNAME || vars.AUTH_USERNAME || secrets.AUTH_USERNAME }}
  SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || secrets.AUTH_PASSWORD }}

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Comprobar formato
        # gofmt no falla por si solo: solo lista los ficheros mal formateados.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Ficheros sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Compilar
        run: go build ./...

      - name: Tests con cobertura
        # -race necesita CGO, que ubuntu-latest tiene. Si tu runner no tuviera
        # toolchain de C, quita esa opcion.
        run: go test ./... -race -coverpkg=./internal/... -coverprofile=coverage.out

      - name: Exigir el umbral de cobertura
        # Go no tiene umbral integrado, a diferencia de Jest y Karma. Sin esta
        # comprobacion el objetivo del 80% seria decorativo.
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Cobertura total: ${total}%"
          awk -v t="$total" -v min="${{ env.COVERAGE_THRESHOLD }}" \
            'BEGIN { exit (t + 0 >= min + 0) ? 0 : 1 }' \
            || { echo "Cobertura ${total}% por debajo del minimo ${{ env.COVERAGE_THRESHOLD }}%"; exit 1; }

  image:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construir sin publicar: verifica que el Dockerfile sigue siendo valido en
      # cada pull request, no la primera vez que alguien despliega.
      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: desplegar
    needs: [verify, image]
    # ESTA CONDICION ES LO QUE EVITA DESPLEGAR EN CADA PULL REQUEST.
    # Si se toca, comprobar que un pull request sigue sin llegar a AWS.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Sin claves de acceso: GitHub emite un token OIDC de vida corta y AWS lo
      # cambia por credenciales temporales. No hay nada que rotar ni que filtrar.
      - name: Validar variables de despliegue
        run: |
          set -euo pipefail
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "Falta la variable ECR_REPOSITORY en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "$LAMBDA_FUNCTION_NAME" ]; then
            echo "Falta la variable LAMBDA_FUNCTION_NAME en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "${GO_API_URL:-}" ]; then
            echo "Falta la variable GO_API_URL en GitHub Actions (Variables o Secrets)."
            echo "Pon aquí la URL pública real de este backend Go, por ejemplo https://tu-dominio.com/api/v1"
            exit 1
          fi
          if [ -z "${NODE_SERVICE_URL:-}" ]; then
            echo "Falta la variable NODE_SERVICE_URL en GitHub Actions (Variables o Secrets)."
            echo "Pon aquí la URL pública real del backend Node, por ejemplo https://tu-dominio.com/api/v1"
            exit 1
          fi
          if [ -z "${CORS_ALLOWED_ORIGINS:-}" ]; then
            echo "Falta la variable CORS_ALLOWED_ORIGINS en GitHub Actions (Variables o Secrets)."
            echo "Pon aquí el origen del frontend, por ejemplo https://tu-frontend.com"
            exit 1
          fi

          # Estas tres se validan aquí, antes de tocar AWS, porque el paso de configuración
          # reemplaza el mapa entero: desplegar sin ellas deja la función sin arrancar y la
          # Function URL devolviendo 502 a todo.
          if [ -z "${JWT_SECRET:-}" ]; then
            echo "Falta el secret JWT_SECRET en GitHub Actions."
            echo "Tiene que ser el mismo valor que en node-api."
            exit 1
          fi
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "JWT_SECRET tiene ${#JWT_SECRET} caracteres y el mínimo son 32."
            exit 1
          fi
          if [ -z "${AUTH_USERNAME:-}" ]; then
            echo "Falta la variable AUTH_USERNAME en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "${AUTH_PASSWORD:-}" ]; then
            echo "Falta el secret AUTH_PASSWORD en GitHub Actions."
            exit 1
          fi

      - name: Autenticar en AWS con OIDC
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-go-api-${{ github.run_id }}

      - name: Autenticar en AWS con credenciales estáticas
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar autenticación AWS
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verificar acceso al repositorio ECR
        run: |
          set -euo pipefail
          echo "Repositorio ECR: $ECR_REPOSITORY"
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Actualizar la funcion Lambda
        run: |
          set -euo pipefail

          image="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Desplegando $image"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$image" \
            --publish \
            --no-cli-pager

          # Esperar a que termine la actualizacion de codigo antes de tocar la
          # configuracion; si no, AWS devuelve ResourceConflictException.
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          # El mapa se construye con jq y no interpolando la forma corta Variables={K=V,...}:
          # esa notacion se rompe con cualquier valor que contenga una coma o un igual, y aqui
          # viajan una contraseña y un secreto.
          #
          # La salida se descarta porque incluye las variables de entorno de la funcion.
          entorno=$(jq -n \
            --arg node_service_url "$NODE_SERVICE_URL" \
            --arg node_service_auth "$NODE_SERVICE_AUTH" \
            --arg node_service_timeout_ms "$NODE_SERVICE_TIMEOUT_MS" \
            --arg jwt_secret "$JWT_SECRET" \
            --arg jwt_expiration_minutes "$JWT_EXPIRATION_MINUTES" \
            --arg auth_username "$AUTH_USERNAME" \
            --arg auth_password "$AUTH_PASSWORD" \
            --arg cors_allowed_origins "$CORS_ALLOWED_ORIGINS" \
            --arg max_matrix_dimension "$MAX_MATRIX_DIMENSION" \
            --arg log_level "$LOG_LEVEL" \
            '{Variables: {
              NODE_SERVICE_URL: $node_service_url,
              NODE_SERVICE_AUTH: $node_service_auth,
              NODE_SERVICE_TIMEOUT_MS: $node_service_timeout_ms,
              JWT_SECRET: $jwt_secret,
              JWT_EXPIRATION_MINUTES: $jwt_expiration_minutes,
              AUTH_USERNAME: $auth_username,
              AUTH_PASSWORD: $auth_password,
              CORS_ALLOWED_ORIGINS: $cors_allowed_origins,
              MAX_MATRIX_DIMENSION: $max_matrix_dimension,
              LOG_LEVEL: $log_level
            }}')

          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --environment "$entorno" \
            --no-cli-pager > /dev/null

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          estado=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'LastUpdateStatus' --output text)

          echo "LastUpdateStatus: $estado"
          [ "$estado" = "Successful" ] || exit 1

  smoke:
    name: smoke test
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # El unico test que comprueba el sistema desplegado de punta a punta. Si
      # go-api no alcanzara a node-api, esto responderia 502.
      - name: Flujo completo de factorizacion
        run: |
          set -euo pipefail

          token=$(curl -fsS --retry 5 --retry-delay 5 \
            -X POST "$GO_API_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$SMOKE_USERNAME" --arg p "$SMOKE_PASSWORD" '{username: $u, password: $p}')" \
            | jq -r '.data.accessToken')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "No se obtuvo token: revisa SMOKE_USERNAME y SMOKE_PASSWORD"
            exit 1
          fi

          # Matriz diagonal: comprueba tambien que la tolerancia de isDiagonal
          # sigue funcionando sobre los residuos que deja la factorizacion.
          curl -fsS -X POST "$GO_API_URL/factorization" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"matrix":[[2,0],[0,3]]}' \
            | jq -e '.success == true
                     and (.data.q | length) == 2
                     and .data.statistics.q.isDiagonal == true
                     and .data.statistics.r.isDiagonal == true' > /dev/null

          echo "Factorizacion verificada de punta a punta"
