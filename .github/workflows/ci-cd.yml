name: CI/CD

# Un solo workflow para verificar y desplegar.
#
# Lo que separa las dos cosas es la condicion de los jobs de despliegue: se
# ejecutan solo con una etiqueta de version o a mano, nunca en un pull request.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Un push nuevo cancela la verificacion anterior, pero un despliegue en curso no
  # se interrumpe: dejar una Lambda a medio actualizar es peor que esperar.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  id-token: write # para pedir el token OIDC con el que se asume el rol

env:
  GO_VERSION: '1.25'
  COVERAGE_THRESHOLD: 80
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || secrets.LAMBDA_FUNCTION_NAME }}
  API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
  SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME || secrets.SMOKE_USERNAME }}

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Comprobar formato
        # gofmt no falla por si solo: solo lista los ficheros mal formateados.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Ficheros sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Compilar
        run: go build ./...

      - name: Tests con cobertura
        # -race necesita CGO, que ubuntu-latest tiene. Si tu runner no tuviera
        # toolchain de C, quita esa opcion.
        run: go test ./... -race -coverpkg=./internal/... -coverprofile=coverage.out

      - name: Exigir el umbral de cobertura
        # Go no tiene umbral integrado, a diferencia de Jest y Karma. Sin esta
        # comprobacion el objetivo del 80% seria decorativo.
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Cobertura total: ${total}%"
          awk -v t="$total" -v min="${{ env.COVERAGE_THRESHOLD }}" \
            'BEGIN { exit (t + 0 >= min + 0) ? 0 : 1 }' \
            || { echo "Cobertura ${total}% por debajo del minimo ${{ env.COVERAGE_THRESHOLD }}%"; exit 1; }

  image:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construir sin publicar: verifica que el Dockerfile sigue siendo valido en
      # cada pull request, no la primera vez que alguien despliega.
      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: desplegar
    needs: [verify, image]
    # ESTA CONDICION ES LO QUE EVITA DESPLEGAR EN CADA PULL REQUEST.
    # Si se toca, comprobar que un pull request sigue sin llegar a AWS.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Sin claves de acceso: GitHub emite un token OIDC de vida corta y AWS lo
      # cambia por credenciales temporales. No hay nada que rotar ni que filtrar.
      - name: Validar variables de despliegue
        run: |
          set -euo pipefail
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "Falta la variable ECR_REPOSITORY en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "$LAMBDA_FUNCTION_NAME" ]; then
            echo "Falta la variable LAMBDA_FUNCTION_NAME en GitHub Actions (Variables o Secrets)."
            exit 1
          fi

      - name: Autenticar en AWS con OIDC
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-go-api-${{ github.run_id }}

      - name: Autenticar en AWS con credenciales estáticas
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar autenticación AWS
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verificar acceso al repositorio ECR
        run: |
          set -euo pipefail
          echo "Repositorio ECR: $ECR_REPOSITORY"
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Actualizar la funcion Lambda
        run: |
          set -euo pipefail

          image="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Desplegando $image"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$image" \
            --publish \
            --no-cli-pager

          # Sin esta espera el workflow saldria en verde con la funcion aun
          # actualizandose, o incluso habiendo fallado la actualizacion.
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          estado=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'LastUpdateStatus' --output text)

          echo "LastUpdateStatus: $estado"
          [ "$estado" = "Successful" ] || exit 1

  smoke:
    name: smoke test
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # El unico test que comprueba el sistema desplegado de punta a punta. Si
      # go-api no alcanzara a node-api, esto responderia 502.
      - name: Flujo completo de factorizacion
        run: |
          set -euo pipefail

          token=$(curl -fsS --retry 5 --retry-delay 5 \
            -X POST "$API_BASE_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$SMOKE_USERNAME\",\"password\":\"${{ secrets.SMOKE_PASSWORD }}\"}" \
            | jq -r '.data.accessToken')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "No se obtuvo token: revisa SMOKE_USERNAME y SMOKE_PASSWORD"
            exit 1
          fi

          # Matriz diagonal: comprueba tambien que la tolerancia de isDiagonal
          # sigue funcionando sobre los residuos que deja la factorizacion.
          curl -fsS -X POST "$API_BASE_URL/factorization" \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"matrix":[[2,0],[0,3]]}' \
            | jq -e '.success == true
                     and (.data.q | length) == 2
                     and .data.statistics.q.isDiagonal == true
                     and .data.statistics.r.isDiagonal == true' > /dev/null

          echo "Factorizacion verificada de punta a punta"
